<div class="surface-card flex max-h-[90vh] flex-col overflow-hidden shadow-xl">
  <header class="flex items-start justify-between gap-4 border-b border-border px-6 py-4">
    <div>
      <h2 class="text-lg text-heading">Emisor de la firma</h2>
      <p class="mt-0.5 truncate text-sm text-body">{{ signature.subject }}</p>
    </div>
    <button type="button" (click)="close()" [disabled]="saving()" aria-label="Cerrar"
      class="rounded-lg p-1.5 text-text-muted transition-colors hover:bg-surface-hover disabled:opacity-50">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </header>

  <div class="flex-1 space-y-4 overflow-y-auto px-6 py-5">
    @if (error()) {
      <div class="rounded-xl border border-red-300/60 bg-red-500/10 px-4 py-3 text-sm text-red-700 dark:text-red-300">{{ error() }}</div>
    }

    <div>
      <div class="mb-1.5 flex items-center justify-between">
        <label for="si-issuer" class="text-sm font-medium text-heading">Emisor</label>
        <span class="flex gap-4">
          @if (current()) {
            <button type="button" (click)="editIssuer()"
              class="text-xs font-semibold text-primary hover:underline">Editar emisor</button>
          }
          <button type="button" (click)="createIssuer()"
            class="text-xs font-semibold text-primary hover:underline">+ Crear emisor</button>
        </span>
      </div>
      <select id="si-issuer" [formControl]="issuerId" class="input-field">
        <option value="">Sin emisor</option>
        @for (i of issuers(); track i.id) {
          <option [value]="i.id">{{ i.ruc }} · {{ i.legalName }}{{ i.active ? '' : ' (inactivo)' }}</option>
        }
      </select>
      @if (!loading() && issuers().length === 0) {
        <p class="mt-1.5 text-xs text-text-subtle">Aún no hay emisores registrados.</p>
      }
    </div>
  </div>

  <footer class="flex justify-end gap-3 border-t border-border px-6 py-4">
    <button type="button" (click)="close()" [disabled]="saving()"
      class="rounded-xl border border-border px-5 py-2.5 text-sm font-semibold text-text transition-colors hover:bg-surface-hover disabled:opacity-50">
      Cancelar
    </button>
    <button type="button" class="btn-primary" (click)="save()" [disabled]="saving() || loading()">
      {{ saving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </footer>
</div>
