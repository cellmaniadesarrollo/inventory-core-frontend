<section class="space-y-6">
  <!-- Tarjetas -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
    @for (s of stats; track s.titulo) {
      <div class="bg-white rounded-xl shadow p-5">
        <p class="text-sm text-gray-500">{{ s.titulo }}</p>
        <p class="text-3xl font-bold mt-1" [class]="s.color">{{ s.valor }}</p>
      </div>
    }
  </div>

  <!-- Últimos movimientos -->
  <div class="bg-white rounded-xl shadow">
    <h2 class="px-5 py-4 font-semibold text-gray-700 border-b">Últimos movimientos</h2>
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-left">
        <tr>
          <th class="px-5 py-3">Fecha</th>
          <th class="px-5 py-3">Producto</th>
          <th class="px-5 py-3">Tipo</th>
          <th class="px-5 py-3 text-right">Cantidad</th>
        </tr>
      </thead>
      <tbody>
        @for (m of movimientos; track $index) {
          <tr class="border-t">
            <td class="px-5 py-3">{{ m.fecha }}</td>
            <td class="px-5 py-3">{{ m.producto }}</td>
            <td class="px-5 py-3">
              <span
                class="px-2 py-1 rounded-full text-xs"
                [class]="m.tipo === 'Entrada' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
              >
                {{ m.tipo }}
              </span>
            </td>
            <td class="px-5 py-3 text-right">{{ m.cantidad }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
