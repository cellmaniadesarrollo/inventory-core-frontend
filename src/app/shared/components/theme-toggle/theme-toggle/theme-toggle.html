<button
  type="button"
  (click)="themeService.toggle()"
  class="w-9 h-9 flex items-center justify-center rounded-lg border border-border
         text-text-muted hover:bg-bg hover:text-text transition-colors"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
>
  @if (themeService.theme() === 'dark') {
    <!-- ícono sol (mostrar cuando está en oscuro, para cambiar a claro) -->
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>
  } @else {
    <!-- ícono luna (mostrar cuando está en claro, para cambiar a oscuro) -->
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
    </svg>
  }
</button>
