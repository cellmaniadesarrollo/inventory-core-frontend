<!-- Menú reutilizable -->
<ng-template #navLinks let-compact="compact">
  <nav class="flex-1 space-y-1 overflow-y-auto p-3">
    @for (item of menu; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="nav-item-active"
        class="nav-item"
        [class.justify-center]="compact"
        [class.px-0]="compact"
        [attr.title]="compact ? item.label : null"
      >
        <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        @if (!compact) {
          <span class="truncate">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <div class="border-t border-border p-3">
    <button
      type="button"
      (click)="auth.logout()"
      class="nav-item w-full cursor-pointer"
      [class.justify-center]="compact"
      [class.px-0]="compact"
      [attr.title]="compact ? 'Cerrar sesión' : null"
    >
      <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icons.logout" />
      </svg>
      @if (!compact) {
        <span>Cerrar sesión</span>
      }
    </button>
  </div>
</ng-template>

<!-- Logo reutilizable -->
<ng-template #brand let-compact="compact">
  <div class="flex items-center gap-3">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary text-white">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
      </svg>
    </div>
    @if (!compact) {
      <span class="truncate text-lg font-bold text-heading">Inventario MS</span>
    }
  </div>
</ng-template>

<div class="flex h-dvh bg-bg">
  <!-- ===== Sidebar escritorio ===== -->
  <aside
    class="hidden shrink-0 flex-col overflow-hidden border-r border-border bg-surface transition-[width] duration-300 ease-in-out lg:flex"
    [class.w-64]="!collapsed()"
    [class.w-20]="collapsed()"
  >
    <div class="flex h-16 items-center border-b border-border px-5" [class.justify-center]="collapsed()" [class.px-0]="collapsed()">
      <ng-container *ngTemplateOutlet="brand; context: { compact: collapsed() }" />
    </div>
    <ng-container *ngTemplateOutlet="navLinks; context: { compact: collapsed() }" />
  </aside>

  <!-- ===== Panel móvil (baja desde arriba) ===== -->
  <div
    class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm transition-opacity duration-300 lg:hidden"
    [class.opacity-0]="!mobileOpen()"
    [class.pointer-events-none]="!mobileOpen()"
    (click)="closeMobile()"
    aria-hidden="true"
  ></div>

  <div
    class="fixed inset-x-0 top-0 z-50 flex max-h-[85dvh] flex-col rounded-b-3xl border-b border-border bg-surface shadow-2xl transition-[transform,visibility] duration-300 ease-out lg:hidden"
    [class.-translate-y-full]="!mobileOpen()"
    [class.invisible]="!mobileOpen()"
    role="dialog"
    aria-label="Menú de navegación"
  >
    <div class="flex h-16 shrink-0 items-center justify-between border-b border-border px-5">
      <ng-container *ngTemplateOutlet="brand; context: { compact: false }" />
      <button
        type="button"
        (click)="closeMobile()"
        class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg border border-border text-body transition-colors hover:bg-bg hover:text-heading"
        aria-label="Cerrar menú"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icons.close" />
        </svg>
      </button>
    </div>
    <ng-container *ngTemplateOutlet="navLinks; context: { compact: false }" />
  </div>

  <!-- ===== Contenido ===== -->
  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <header class="flex h-16 shrink-0 items-center justify-between border-b border-border bg-surface px-4 sm:px-6">
      <div class="flex items-center gap-3">
        <button
          type="button"
          (click)="toggleSidebar()"
          class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg border border-border text-body transition-colors hover:bg-bg hover:text-heading"
          aria-label="Alternar menú"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icons.menu" />
          </svg>
        </button>
        <h1 class="font-semibold text-heading">Panel de control</h1>
      </div>

      <div class="flex items-center gap-3">
        <span class="hidden text-sm text-body sm:inline">
          {{ auth.user()?.username }} · {{ auth.user()?.branchName }}
        </span>
        <app-theme-toggle />
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>
